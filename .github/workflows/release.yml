name: Publish preview release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build.py
      - run: python tools/export_source.py
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("src/dcc_workflow_kit/blender_manifest.toml", "rb"))["version"])')
          gh release create "v${version}" dist/*.zip dist/*.sha256 --prerelease --title "DCC Workflow Kit ${version} 整合汉化预览版" --notes-file RELEASE_NOTES.md

schema_version = "1.0.0"
id = "dcc_workflow_kit"
version = "0.1.1"
name = "DCC Workflow Kit"
tagline = "Choose a Max or Maya workflow alongside Blender"
maintainer = "DCC Workflow Kit contributors"
type = "add-on"
tags = ["User Interface"]
blender_version_min = "5.1.0"
